<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OxGuess questions</title>
  <link rel="icon" href="/site/img/ox.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/site/styles.css">
  <style>
    /* The question editor (local only). Game tokens from styles.css; everything here is ed- prefixed. */
    body { background: var(--bg); }
    .ed { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; display: flex; flex-direction: column; gap: 16px; }
    .ed-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-bottom: 2px solid var(--line); }
    .ed-bar h1 { font-size: 22px; display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .ed-state { font: 800 12px var(--body); padding: 4px 10px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
    .ed-state.warn { background: var(--ticket); border-color: var(--c-when); color: var(--ink); }
    .ed-state.bad { background: color-mix(in srgb, var(--stamp) 15%, var(--card)); border-color: var(--stamp); color: var(--stamp); }
    .ed-state.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
    .ed .btn { font-size: 14px; padding: 8px 14px; }
    .ed .btn[disabled] { opacity: .45; cursor: default; }
    .ed-tabs { display: flex; gap: 6px; }
    .ed-tabs button { font: 800 14px var(--body); padding: 7px 14px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
    .ed-tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
    .ed-report { white-space: pre-wrap; font: 600 13px/1.5 ui-monospace, Menlo, monospace; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; }
    .ed-report.bad { border-color: var(--stamp); color: var(--stamp); }
    .ed-day { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .ed-day.today { border-color: var(--c-when); }
    .ed-day.past { opacity: .7; }
    .ed-day h3 { font: 600 17px var(--display); margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .ed-day h3 small { font: 700 13px var(--body); color: var(--muted); }
    .ed-day .note { font-size: 12.5px; color: var(--stamp); font-weight: 700; }
    .ed-slot { display: grid; grid-template-columns: 92px minmax(0, 1fr) 150px 210px 190px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14px; }
    .ed-slot:first-of-type { border-top: 0; }
    .ed-chip { font: 800 11px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--cat); }
    .ed-q { min-width: 0; }
    .ed-q b { font-weight: 700; }
    .ed-q .id { font: 600 11px ui-monospace, Menlo, monospace; color: var(--muted); }
    .ed-ans { font: 600 15px var(--display); }
    .ed-mini { display: flex; flex-direction: column; gap: 3px; }
    .ed-mini .row { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: center; font: 800 10px var(--body); color: var(--muted); }
    .bar { position: relative; height: 8px; border-radius: 4px; background: var(--line); }
    .bar i { position: absolute; top: -4px; width: 3px; height: 16px; margin-left: -1.5px; border-radius: 2px; background: var(--good); }
    .bar i.mid { background: var(--muted); width: 2px; height: 10px; top: -1px; opacity: .6; }
    .ed-acts { display: flex; gap: 6px; align-items: center; }
    .ed-acts select { min-width: 0; flex: 1; font: 600 13px var(--body); padding: 6px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
    .ed-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ed-tools input, .ed-tools select { font: 600 14px var(--body); padding: 7px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
    table.ed-bank { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 16px; overflow: hidden; font-size: 14px; }
    .ed-bank th { text-align: left; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
    .ed-bank td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .ed-bank tr { cursor: pointer; }
    .ed-bank tr:hover td { background: var(--card-soft); }
    .ed-bank .st { font: 800 12px var(--body); white-space: nowrap; }
    .ed-bank .st.spare { color: var(--c-many); } .ed-bank .st.retired { color: var(--muted); } .ed-bank .st.past { color: var(--muted); }
    /* the edit panel */
    .ed-shade { position: fixed; inset: 0; background: rgba(20, 30, 22, .35); z-index: 20; }
    .ed-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--card); z-index: 21; overflow-y: auto; padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 12px; box-shadow: -10px 0 30px rgba(0, 0, 0, .15); }
    .ed-panel h2 { font-size: 20px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .ed-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .ed-f { display: flex; flex-direction: column; gap: 3px; font: 800 12px var(--body); color: var(--muted); min-width: 0; }
    .ed-f.w2 { grid-column: span 2; } .ed-f.w4 { grid-column: span 4; }
    .ed-f input, .ed-f select, .ed-f textarea { font: 600 14px var(--body); color: var(--ink); padding: 7px 9px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); min-width: 0; }
    .ed-f textarea { min-height: 64px; resize: vertical; font-weight: 600; }
    .ed-f input:focus, .ed-f select:focus, .ed-f textarea:focus { outline: none; border-color: var(--c-far); }
    .ed-f .hint { font-weight: 600; font-size: 11.5px; }
    .ed-prev { background: var(--card-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .ed-prev h4 { margin: 0; font: 800 12px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .ed-slider { display: flex; flex-direction: column; gap: 4px; }
    .ed-slider .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .ed-slider .bar { height: 10px; }
    .ed-slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; }
    .ed-warn { font-size: 12.5px; font-weight: 700; color: var(--stamp); }
    .ed-ok { font-size: 12.5px; font-weight: 700; color: var(--good); }
    .ed-misses { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    @media (max-width: 900px) { .ed-slot { grid-template-columns: 80px minmax(0, 1fr); } .ed-slot > .ed-mini, .ed-slot > .ed-acts { grid-column: 2; } .ed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ed-f.w4 { grid-column: span 2; } }
  </style>
</head>
<body>
  <div class="ed" id="ed"></div>
  <script type="module" src="/editor.js"></script>
</body>
</html>
