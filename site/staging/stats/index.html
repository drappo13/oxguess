<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OxGuess stats (new)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/ox.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Staging: the new /stats. Game tokens from /styles.css; everything here is st- prefixed so nothing collides. */
    .st { max-width: 860px; margin: 0 auto; padding-block: max(16px, env(safe-area-inset-top, 0px)) 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: flex; flex-direction: column; gap: 14px; }
    .st-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .st-top .brand { display: inline-flex; align-items: center; gap: 8px; font: 600 22px var(--display); color: var(--ink); text-decoration: none; }
    .st-top .when { font-size: 13px; color: var(--muted); font-weight: 700; }
    .st-h { font: 800 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 0 0; padding-top: 14px; border-top: 1.5px solid var(--line); }
    .st-h:first-of-type { border-top: 0; padding-top: 0; }
    .st-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .st-tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .st-tile .l { font-size: 12px; font-weight: 800; color: var(--muted); }
    .st-tile .v { font: 600 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
    .st-tile .s { font-size: 12px; color: var(--muted); font-weight: 600; }
    .st-card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .st-card h3 { font: 600 17px var(--display); margin: 0; }
    .st-card .note { font-size: 12.5px; color: var(--muted); margin: 0; }
    .st-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
    .st-two > * { min-width: 0; }
    .st svg.ch { display: block; width: 100%; height: auto; overflow: visible; }
    .st svg text { font-family: var(--body); font-size: 11px; font-weight: 700; fill: var(--muted); }
    .st svg text.ink { fill: var(--ink); }
    .st-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .st-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .st-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.st-t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .st-t th { text-align: right; font-size: 11px; font-weight: 800; color: var(--muted); padding: 6px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
    .st-t td { text-align: right; padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; }
    .st-t th:first-child, .st-t td:first-child { text-align: left; }
    .st-t td.dim { color: var(--muted); }
    .st-t tr:last-child td { border-bottom: 0; }
    table.st-cohort { border-collapse: separate; border-spacing: 3px; font-size: 12.5px; font-variant-numeric: tabular-nums; width: 100%; }
    .st-cohort th { font-size: 11px; font-weight: 800; color: var(--muted); padding: 2px 4px; white-space: nowrap; }
    .st-cohort td { text-align: center; padding: 6px 4px; border-radius: 8px; white-space: nowrap; font-weight: 700; }
    .st-cohort td.lab { text-align: left; font-weight: 700; background: none; }
    .st-cohort td.n { color: var(--muted); background: none; text-align: right; }
    .st-round { border: 2px solid var(--line); border-radius: 18px; background: var(--card); overflow: hidden; }
    .st-round > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .st-round > summary::-webkit-details-marker { display: none; }
    .st-round > summary b { font: 600 17px var(--display); }
    .st-round > summary .meta { font-size: 13px; color: var(--muted); font-weight: 700; }
    .st-round > summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
    .st-round[open] > summary .chev { transform: rotate(90deg); }
    .st-round .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
    .st-q { display: grid; grid-template-columns: 1fr; gap: 4px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
    .st-q .qt { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
    .st-q .chip { flex: none; font-size: 11px; font-weight: 800; color: var(--cat); text-transform: uppercase; letter-spacing: .06em; }
    .st-q .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .st-q .nums b { color: var(--ink); }
    .st-hide { font-size: 13px; }
    .st-foot { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
    .st-foot label { display: inline-flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <div id="stats" class="st"></div>
  <script type="module" src="stats.js"></script>
</body>
</html>
