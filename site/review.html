<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>OxGuess: review the changes</title>
  <link rel="icon" href="img/ox.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- A review page for the delight branch only: every change on its own card, with a verdict and a note. Delete before shipping. -->
  <style>
    .rv { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 18px; }
    .rv-intro h1 { margin: 0 0 6px; }
    .rv-intro p { margin: 0; color: var(--muted); }
    .rv-item { gap: 12px; }
    .rv-item h2 { display: flex; gap: 10px; align-items: baseline; margin: 0; font-size: 19px; }
    .rv-item h2 .n { font: 800 13px var(--body); color: var(--muted); }
    .rv-item h2 .tag { margin-left: auto; font: 800 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--c-far); }
    .rv-item h2 .tag.feel { color: var(--c-wild); }
    .rv-why { margin: 0; font-size: 14px; color: var(--muted); text-wrap: pretty; }
    .rv-demo { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: var(--bg); }
    .rv-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rv-row .btn { font-size: 14px; padding: 8px 12px; }
    .rv-verdict { display: flex; gap: 6px; flex-wrap: wrap; }
    .rv-verdict button { font: 700 14px var(--body); padding: 7px 12px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .rv-verdict button.on[data-v="keep"] { background: var(--good); border-color: var(--good); color: #fff; }
    .rv-verdict button.on[data-v="change"] { background: var(--c-when); border-color: var(--c-when); color: #2b2410; }
    .rv-verdict button.on[data-v="drop"] { background: var(--stamp); border-color: var(--stamp); color: #fff; }
    .rv-note { width: 100%; min-height: 44px; font: 500 14px var(--body); padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; box-sizing: border-box; }
    .rv-mini-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; }
    .rv-mini-head .brand span { font-size: 21px; }
    .rv-share { white-space: pre-wrap; background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0; }
    .rv-tab { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px 10px 0 0; background: var(--card); font: 600 13px var(--body); border: 1px solid var(--line); border-bottom: 0; }
    .rv-q { padding: 14px; border-radius: 16px; background: var(--card); font: 600 17px var(--display); }
    .rv-done { margin-top: 6px; }
    .rv-out { white-space: pre-wrap; font-size: 13px; background: var(--card); border: 2px dashed var(--line); border-radius: 12px; padding: 10px; }
  </style>
</head>
<body>
<main class="rv" id="rv"></main>
<script type="module">
import { oxHead, rosette, fairgoer, chalkboard } from "./js/art.js";
import { sfx, countUp, stampIn, pop, bunting, flash, flyTo, chalkUp } from "./js/fx.js";

// A copy of the game's streak ticket (app.js keeps its own; this page is throwaway).
function streakTicket(n, size = 38) {
  const w = String(n).length > 2 ? 36 : 30;
  return `<svg class="streak-ticket" width="${Math.round((size * (w + 2)) / 32)}" height="${Math.round((size * 22) / 32)}" viewBox="-1 -1 ${w + 2} 22" role="img" aria-label="${n}-day streak">
    <path d="M3 0 H${w - 3} A3 3 0 0 1 ${w} 3 V7.5 A2.5 2.5 0 0 0 ${w} 12.5 V17 A3 3 0 0 1 ${w - 3} 20 H3 A3 3 0 0 1 0 17 V12.5 A2.5 2.5 0 0 0 0 7.5 V3 A3 3 0 0 1 3 0 Z" fill="var(--ticket)" stroke="var(--art-ink)" stroke-width="1.5"/>
    <line x1="9" x2="9" y1="2.5" y2="17.5" stroke="var(--stamp)" stroke-width="1" stroke-dasharray="2 1.6"/><circle cx="4.6" cy="10" r="1.5" fill="var(--stamp)"/>
    <text x="${9 + (w - 9) / 2}" y="14.2" text-anchor="middle" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="11" fill="#2b2410">${n}</text></svg>`;
}
const stampTick = `<span class="stamp" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12.5 20.5 l5 5 l10 -11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const face = (r) => `<span class="stamp face ${r}">${r === "you" ? fairgoer({ size: 24 }) : r === "herd" ? oxHead({ size: 24 }) : fairgoer({ size: 17 }) + oxHead({ size: 17 })}</span>`;
const play = `<svg class="play-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8 L16 12 L10 16 Z"/></svg>`;
const week = (cells) => `<div class="tickets">${cells.map(([l, cls, mark]) => `<span class="ticket ${cls}"><b>${l}</b>${mark}</span>`).join("")}</div>`;

// Each change: what it is, why, a demo (html + optional wiring), and its tag.
const ITEMS = [
  { id: "slate", tag: "come back", title: "Morning chalkboard (redesigned)", why: "Before you play, yesterday's result chalked up above the start card: the scores in big chalk (yours in yellow), a headline (\"You beat the herd by 7 points!\"), your placing on its own line when it's in the top half, and a rosette swinging onto the corner for a top-20 finish, with your place on it (purple for 1st). \"Full results\" in the corner scrolls down to yesterday's card and opens it. Five versions below; the button chalks them up again.",
    html: `${[{ you: 92, herd: 77, n: 112, place: 1 }, { you: 84, herd: 77, n: 112, place: 14 }, { you: 74, herd: 77, n: 112, place: 40 }, { you: 31, herd: 73, n: 112, place: 93 }, { you: null, herd: 74 }]
      .map((x) => `<section class="slate">${chalkboard(x)}</section>`).join("")}<div class="rv-row"><button class="btn" data-act="chalk">Chalk them up again</button></div>`,
    wire: (d) => d.querySelectorAll(".slate").forEach((b) => chalkUp(b)),
    act: { chalk: (d) => d.querySelectorAll(".slate").forEach((b, k) => setTimeout(() => chalkUp(b), k * 250)) } },
  { id: "placing", tag: "come back", title: "Tonight's placing", why: "Under the scores on the results card. Top half only; others just see \"Final placings go up in the morning.\"",
    html: `<p class="placing">You're <b>14th of 112</b> so far. Final placings go up in the morning.</p><p class="placing">Early days: <b>3rd of 7</b> so far.</p><p class="placing">Final placings go up in the morning.</p>` },
  { id: "week", tag: "come back", title: "The week against the herd", why: "Each played ticket is stamped with who won the day (you, the ox, or both). A series line underneath, a verdict on Sunday. Tomorrow's ticket dashed with the streak it would make. Today's ticket (unplayed) gently breathes and is the brightest.",
    html: `${week([["M", "played", face("you")], ["T", "played", face("herd")], ["W", "missed", '<i class="miss-mark"></i>'], ["T", "played", face("draw")], ["F", "played is-today", face("you")], ["S", "future next", '<small class="next-l">Day 3</small>'], ["S", "future", ""]])}
      <p class="series">This week: <b>You 2</b>, <b>The herd 1</b>.</p>
      ${week([["M", "played", face("you")], ["T", "played", face("herd")], ["W", "played", face("you")], ["T", "missed", '<i class="miss-mark"></i>'], ["F", "today", play], ["S", "future", ""], ["S", "future", ""]])}
      <p class="series">This week: <b>You 4</b>, <b>The herd 2</b>. You won the week!</p>` },
  { id: "teaser", tag: "come back", title: "Tomorrow's programme", why: "A vague hint at two of tomorrow's questions, under the countdown. Written per question in teasers.json; never the answer.",
    html: `<p class="teaser">On tomorrow's programme: two very busy crossings, and a little gold man.</p><p class="teaser">On tomorrow's programme: a monument to love and the roof of the world, plus a train in a hurry.</p>` },
  { id: "keep", tag: "come back", title: "\"Same time tomorrow?\" ticket", why: "Under Share on your first two rounds only, after the celebration. A daily calendar reminder at the time you played (8am if late at night), or Add to Home Screen. \"Not for me\" hides it for good; later rounds get a small \"Remind me tomorrow\" link instead.",
    html: `<div class="keep"><div class="keep-ticket"><span class="keep-admit">Admit one · tomorrow</span><h3>Same time tomorrow?</h3><p>Five new numbers every day.</p>
      <div class="keep-stubs"><button class="stub-btn" data-act="pencil">Remind me at 8:15am</button><button class="stub-btn" data-act="howto">Add to Home Screen</button></div>
      <p class="keep-how" hidden>Tap the Share button, then Add to Home Screen.</p><span class="keep-done" hidden>Pencilled in</span></div><button class="link">Not for me</button></div>`,
    act: { pencil: (d) => { stampIn(d.querySelector(".keep-done")); sfx.pin(); }, howto: (d) => { d.querySelector(".keep-how").hidden = false; } } },
  { id: "share", tag: "come back", title: "Share text names the herd", why: "A reason for a friend to try: you beat the herd, or the herd's score.",
    html: `<pre class="rv-share">OxGuess Round 7 🐂\n\n🏆🥈🥈🏆🥈 84/100\nBeat the herd by 7 🐂\n🔥 3-day streak\n\noxguess.com</pre><pre class="rv-share">OxGuess Round 7 🐂\n\n🥉⚪🥈🥉⚪ 41/100\nHerd: 77 🐂\n\noxguess.com</pre>` },
  { id: "streak", tag: "come back", title: "Streak as a ticket stub", why: "The 🔥 emoji in the header becomes a drawn ticket stub that hops up a number at the end of a round. Milestone lines: Day tripper (3), a week at the fair (7), Season ticket (30).",
    html: `<div class="rv-mini-head"><span class="brand">${oxHead({ size: 34 })}<span>OxGuess</span></span><span class="streak-pill" id="rv-streak">${streakTicket(2)}</span></div>
      <div class="rv-row"><button class="btn" data-act="hop">Finish a round (hop)</button></div>
      <p class="streak-line"><span class="streak-main">${streakTicket(2, 26)}<b>2-day streak</b></span><span class="streak-sub">One more day and you're a Day tripper.</span></p>
      <p class="streak-line"><span class="streak-main">${streakTicket(5, 26)}<b>5-day streak</b></span><span class="streak-sub">Two more days for a whole week at the fair.</span></p>`,
    act: { hop: (d) => { const p = d.querySelector("#rv-streak"), n = Number(p.textContent.trim()) + 1; p.innerHTML = streakTicket(n); p.animate([{ transform: "rotate(-6deg)" }, { transform: "translateY(-6px) rotate(-12deg)" }, { transform: "rotate(-6deg)" }], { duration: 420, easing: "cubic-bezier(.3,1.6,.5,1)" }); sfx.tick(0.9); } } },
  { id: "bis", tag: "come back", title: "Best in show counter, and rosettes flying to it (new)", why: "All-time Best in shows (questions scored 20) as a purple rosette and a number, next to the streak ticket. At the end of a round, each Best in show rosette wiggles and a copy flies up into the counter, which ticks up, pops and glows as it lands, with a chime that rises for each one. A first ever lands on a 0.",
    html: `<div class="rv-mini-head"><span class="brand">${oxHead({ size: 34 })}<span>OxGuess</span></span><span class="rv-row" style="gap:12px"><span class="bis-pill" id="rv-bis">${rosette("best", "", 24)}<b>3</b></span><span class="streak-pill">${streakTicket(4)}</span></span></div>
      <div class="my-rosettes" id="rv-ros">${[20, 16, 14, 20, 9].map((p, i) => `<span class="my-rosette" data-p="${p}">${rosette(p === 20 ? "best" : p >= 13 ? "second" : "third", p, 42)}<span>${["When", "How tall", "How far", "How many", "Wildcard"][i]}</span></span>`).join("")}</div>
      <div class="rv-row"><button class="btn" data-act="bis">Finish a round with two Best in shows</button></div>`,
    act: { bis: async (d) => {
      const pill = d.querySelector("#rv-bis"), b = pill.querySelector("b"), start = Number(b.textContent), wait = (ms) => new Promise((r) => setTimeout(r, ms));
      let n = start; const landings = [];
      for (const el of d.querySelectorAll(".my-rosette")) {
        if (el.dataset.p !== "20") continue;
        el.animate([{ transform: "none" }, { transform: "scale(1.18) rotate(-12deg)" }, { transform: "scale(1.18) rotate(10deg)" }, { transform: "scale(1.1) rotate(-6deg)" }, { transform: "none" }], { duration: 380, easing: "ease-in-out" });
        await wait(300);
        landings.push(flyTo(el.querySelector(".rosette"), pill, rosette("best", "", 40)).then(() => {
          n++; b.textContent = n; pop(pill, 1.35); sfx.chime(n - start - 1);
          pill.animate([{ filter: "drop-shadow(0 0 0 transparent)" }, { filter: "drop-shadow(0 0 7px var(--r-best))" }, { filter: "drop-shadow(0 0 0 transparent)" }], { duration: 600, easing: "ease-out" });
        }));
        await wait(260);
      }
      await Promise.all(landings);
    } } },
  { id: "moment", tag: "feel", title: "One-off moments as badges (new design)", why: "Your first Best in show, or beating the herd on your first go: once ever, as a badge with its prize, instead of the italic line. Never more than one a round.",
    html: `<div class="moment-wrap"><span class="moment best" id="rv-m1">${rosette("best", "", 34)}<span><b>Your first Best in show</b><small>The judges are impressed.</small></span></span></div>
      <div class="moment-wrap"><span class="moment first" id="rv-m2">${oxHead({ size: 34, mood: "wow" })}<span><b>Beat the herd first go</b><small>Beginner's luck?</small></span></span></div>
      <div class="rv-row"><button class="btn" data-act="m">Show them arriving</button></div>`,
    act: { m: (d) => { ["#rv-m1", "#rv-m2"].forEach((s, k) => setTimeout(() => { pop(d.querySelector(s), 1.08); sfx.chime(); }, k * 500)); } } },
  { id: "pb", tag: "feel", title: "Personal best stamp", why: "Red ink across your score when a round beats your best (from your second round on).",
    html: `<div class="versus" style="max-width:320px;margin:0 auto"><div class="side you">${fairgoer({ size: 46 })}<span class="score-line"><span class="big-num">84</span><small>/100</small></span><span class="who">You</span><span class="pb-stamp" id="rv-pb">Personal best</span></div><span class="vs">vs</span><div class="side">${oxHead({ size: 46, mood: "wow" })}<span class="score-line"><span class="big-num">77</span><small>/100</small></span><span class="who">The herd</span></div></div>
      <div class="rv-row"><button class="btn" data-act="pb">Stamp it</button></div>`,
    act: { pb: (d) => stampIn(d.querySelector("#rv-pb")) } },
  { id: "gate", tag: "come back", title: "Through the gate", why: "How many have guessed today, under the start button (from the herd already loaded, no extra reads).",
    html: `<p class="turnstile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M4.2 7.5l5.2 3M14.6 13.5l5.2 3M4.2 16.5l5.2-3M14.6 10.5l5.2-3"/></svg><span><b>143</b> through the gate today</span></p>` },
  { id: "tab", tag: "come back", title: "Tab title after midnight", why: "A tab left open overnight changes its title, until you look at it.",
    html: `<div><span class="rv-tab">${oxHead({ size: 16 })} New round · OxGuess</span></div>` },
  { id: "slim", tag: "come back", title: "A slimmer finished screen", why: "The separate \"Your stats\" card is gone (its streak and days-won live in Back tomorrow's week line). Yesterday folds to one line; tap for the full prize board.",
    html: `<section class="card yesterday"><details class="y-fold"><summary><span class="y-sum"><h2>Yesterday</h2><span class="y-line">You came 9th of 42 · Herd 66</span></span><span class="chev"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></span></summary><div class="y-body"><p class="muted">(the prize board, the standings and question by question)</p></div></details></section>` },
  { id: "buttons", tag: "feel", title: "Buttons that sink and spring back", why: "Pressed: a little smaller and lower, the shadow collapsing; let go: a springy return. The big buttons give a soft wooden tap. Press and hold to feel it.",
    html: `<button class="btn primary big" style="width:100%">Lock it in</button><button class="btn" style="align-self:flex-start">Back</button>` },
  { id: "transition", tag: "feel", title: "Moving between questions", why: "The card slides out left, the next slides in from the right, the finished progress segment fills in and the next category pill pops. 300 ms in all.",
    html: `<div class="progress" id="rv-prog" style="--cat: var(--c-far)"><span class="done" style="--cat: var(--c-when)"></span><span class="current" style="--cat: var(--c-big)">How tall</span><span></span><span></span><span></span></div><div class="rv-q" id="rv-q">How tall is Leonardo da Vinci's Mona Lisa painting?</div><div class="rv-row"><button class="btn" data-act="next">Next question</button></div>`,
    act: { next: async (d) => {
      const qs = ["How far is it from Times Square in New York to Shibuya Crossing in Tokyo?", "How many keys does a standard modern piano have?", "How much does an Oscar statuette weigh?", "In what year was the original Star Wars film first released?", "How tall is Leonardo da Vinci's Mona Lisa painting?"];
      const cats = [["How far", "var(--c-far)"], ["How many", "var(--c-many)"], ["Wildcard", "var(--c-wild)"], ["When", "var(--c-when)"], ["How tall", "var(--c-big)"]];
      const q = d.querySelector("#rv-q"), i = Number(q.dataset.i ?? -1) + 1, k = i % 5;
      await q.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(-24px)" }], { duration: 140, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
      q.textContent = qs[k]; q.dataset.i = i;
      q.animate([{ opacity: 0, transform: "translateX(24px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2,.9,.3,1.1)" });
      const p = d.querySelector("#rv-prog"), segs = ["When", "How tall", "How far", "How many", "Wildcard"], cur = (k + 1) % 5 || 0, ci = [2, 3, 4, 0, 1][k];
      p.innerHTML = segs.map((s, j) => j < ci ? `<span class="done ${j === ci - 1 ? "just-done" : ""}" style="--cat:${["var(--c-when)", "var(--c-big)", "var(--c-far)", "var(--c-many)", "var(--c-wild)"][j]}"></span>` : j === ci ? `<span class="current" style="--cat:${cats[k][1]}">${cats[k][0]}</span>` : "<span></span>").join("");
      p.querySelector(".current").animate([{ transform: "scale(1.2)" }, { transform: "none" }], { duration: 260, easing: "cubic-bezier(.3,1.6,.5,1)" }); sfx.tick(0.8);
    } } },
  { id: "slider", tag: "feel", title: "The slider", why: "The tick rises in pitch as you drag right; the knob squishes while held. (Haptics are Android only.)",
    html: `<div class="tape" style="--cat: var(--c-far)"><input type="range" id="rv-slider" min="0" max="1000" value="500" aria-label="Try the slider"></div>`,
    wire: (d) => { const s = d.querySelector("#rv-slider"); s.oninput = () => sfx.tick(s.value / 1000); } },
  { id: "striker", tag: "feel", title: "The strength tester", why: "One tick a point as the puck climbs, each a semitone higher, landing with a thunk (the old one was a whoosh). The bell at 20 is now a real bell with a hammer strike. At 19 the bell trembles: \"A whisker off the bell!\"",
    html: `<div class="rv-row"><button class="btn" data-act="c12">Score 12</button><button class="btn" data-act="c19">Score 19 (whisker)</button><button class="btn" data-act="c20">Score 20 (bell)</button></div>`,
    act: Object.fromEntries([12, 19, 20].map((p) => [`c${p}`, () => {
      const climb = 250 + p * 28;
      for (let k = 1; k <= p; k++) setTimeout(() => sfx.climb(k), climb * (1 - (1 - k / p) ** 0.6) - 20);
      setTimeout(() => { if (p === 20) { sfx.bell(); flash(); bunting({ y: window.innerHeight * 0.4 }); } else if (p === 19) { sfx.land(); sfx.tink(); } else { sfx.land(); sfx.chime(); } }, climb);
    }])) },
  { id: "goodsounds", tag: "feel", title: "Sounds for good guesses", why: "Ding-ding when you beat the herd on a question (it replaced a second chime, not added). The chime climbs a tone for each good guess (13+) in a row. Rosettes pin on with a little \"tk\".",
    html: `<div class="rv-row"><button class="btn" data-act="ding">Ding-ding</button><button class="btn" data-act="run">A run of five good guesses</button><button class="btn" data-act="pin">Rosette pin</button></div>`,
    act: { ding: () => sfx.ding(), pin: () => sfx.pin(), run: () => [0, 1, 2, 3, 4].forEach((k) => setTimeout(() => sfx.chime(k), k * 550)) } },
  { id: "hurry", tag: "feel", title: "Tap to hurry, and a quicker reveal", why: "Tap the card during a reveal and it jumps to the end (one sound, not a pile-up). The sequence is also about a second shorter per question. Try it in the game.",
    html: `<p class="muted" style="margin:0">Play a question in the game and tap the card while the flag is moving.</p>` },
  { id: "ends", tag: "feel", title: "End of the round", why: "A brass-band flourish when you beat the herd (filtered, warmer than before); a good-humoured tuba \"pah-PAH\" when the herd wins (it used to play a happy chime). Judgement call: the product reviewer found the tuba a bit twee.",
    html: `<div class="rv-row"><button class="btn" data-act="win">You beat the herd</button><button class="btn" data-act="lose">The herd wins</button></div>`,
    act: { win: () => { sfx.fanfare(); bunting({ y: window.innerHeight * 0.45, count: 70, power: 1.2 }); }, lose: () => sfx.oompah() } },
  { id: "ox", tag: "feel", title: "The ox", why: "It blinks now and then on the start card (sometimes twice), looks impressed on the results when you win, and moos when you tap it in the header.",
    html: `<div class="rv-row" style="justify-content:space-around"><div class="hero-ox">${oxHead({ size: 96 })}</div><div>${oxHead({ size: 96, mood: "wow" })}</div></div><div class="rv-row"><button class="btn" data-act="moo">Tap the ox: moo</button></div>`,
    act: { moo: (d) => { sfx.moo(); d.querySelector(".hero-ox .ox").animate([{ transform: "rotate(0)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(-3deg)" }, { transform: "rotate(0)" }], { duration: 500 }); } } },
  { id: "story", tag: "feel", title: "The story: have a go yourself", why: "Page 3 is now \"Your go. How heavy was the ox?\" with a slider, before you see the crowd. Page 4 drops your guess among the 787 and tells you how far out you were. Pages slide the way you're going.",
    html: `<div class="rv-row"><a class="btn" href="/?story=1" target="_blank" data-act="story">Open the story in a new tab</a></div><p class="muted" style="margin:0">Or in the game: menu, then The story.</p>`,
    act: { story: () => { try { localStorage.removeItem("ox-story-guess"); } catch {} } } },
  { id: "prizeboard", tag: "come back", title: "Yesterday as a prize board", why: "From earlier this week: a row per rosette tier, a token per player, the ox and you in your rows (instead of the dot line that looked like a guess chart).",
    html: `<p class="muted" style="margin:0">Open Yesterday on the start screen (it's folded now) to see it.</p>` },
];

// ---- drawing, verdicts and notes (kept in this browser) ----
const KEY = "ox-review", saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) ?? {}; } catch { return {}; } })();
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} };
const el = document.getElementById("rv");
el.innerHTML = `<section class="rv-intro"><h1>Review the changes</h1><p>One card per change. Try each, then Keep, Change or Drop, and add a note if you like. Turn your sound up. Your verdicts stay in this browser; "Copy my verdicts" at the bottom puts them on your clipboard to paste back to Claude.</p></section>
  ${ITEMS.map((it, i) => `<section class="card rv-item" data-id="${it.id}">
    <h2><span class="n">${i + 1}</span>${it.title}<span class="tag ${it.tag === "feel" ? "feel" : ""}">${it.tag === "feel" ? "Feel" : "Come back"}</span></h2>
    <p class="rv-why">${it.why}</p>
    <div class="rv-demo">${it.html}</div>
    <div class="rv-verdict">${["keep", "change", "drop"].map((v) => `<button data-v="${v}" class="${saved[it.id]?.v === v ? "on" : ""}">${{ keep: "Keep", change: "Change", drop: "Drop" }[v]}</button>`).join("")}</div>
    <textarea class="rv-note" placeholder="Notes (optional)">${saved[it.id]?.note ?? ""}</textarea>
  </section>`).join("")}
  <div class="rv-done"><button class="btn primary big" id="copy" style="width:100%">Copy my verdicts</button></div>
  <pre class="rv-out" id="out" hidden></pre>`;
for (const sec of el.querySelectorAll(".rv-item")) {
  const it = ITEMS.find((x) => x.id === sec.dataset.id), demo = sec.querySelector(".rv-demo");
  it.wire?.(demo);
  demo.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && it.act?.[b.dataset.act]) it.act[b.dataset.act](demo); });
  sec.querySelectorAll(".rv-verdict button").forEach((b) => (b.onclick = () => {
    saved[it.id] = { ...saved[it.id], v: b.dataset.v }; keep();
    sec.querySelectorAll(".rv-verdict button").forEach((x) => x.classList.toggle("on", x === b)); sfx.tick(0.6);
  }));
  sec.querySelector(".rv-note").oninput = (e) => { saved[it.id] = { ...saved[it.id], note: e.target.value }; keep(); };
}
document.getElementById("copy").onclick = () => {
  const text = ITEMS.map((it, i) => { const s = saved[it.id] ?? {}; return `${i + 1}. ${it.title}: ${s.v ? s.v.toUpperCase() : "no verdict"}${s.note ? `. ${s.note.trim()}` : ""}`; }).join("\n");
  const out = document.getElementById("out"); out.textContent = text; out.hidden = false;
  navigator.clipboard?.writeText(text).then(() => { document.getElementById("copy").textContent = "Copied. Paste it to Claude"; }, () => {});
};
</script>
</body>
</html>
